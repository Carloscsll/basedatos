{% extends "base.html" %}
{% block content %}
<div class="admin-header">
  <h1>Administración de Contenido</h1>
  <a class="btn primary admin-add-btn" href="{{ url_for('admin_contenido_editar') }}">Editar contenido</a>
</div>
<div class="grid" style="margin-top:1rem;">
  {% for item in contenido %}
    <div class="card">
      <h3>{{ item['clave'] }}</h3>
      <p>{{ item['texto'] }}</p>
    </div>
  {% endfor %}
</div>
{% endblock %}
