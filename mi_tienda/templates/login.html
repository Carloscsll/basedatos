<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TechMarket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <div class="brand">Tech<span>Market</span></div>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-box">
            <h1 class="auth-title">🔐 Iniciar Sesión</h1>
            <p class="auth-subtitle">Bienvenido a TechMarket</p>
            
            {% if get_flashed_messages() %}
                <div class="error-message">
                    {% for message in get_flashed_messages() %}
                        {{ message }}
                    {% endfor %}
                </div>
            {% endif %}
            
            <form method="post" class="auth-form">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Tu usuario" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="contraseña">Contraseña</label>
                    <input type="password" id="contraseña" name="contraseña" placeholder="Tu contraseña" required>
                </div>
                
                <button type="submit" class="btn primary full-width">Iniciar Sesión</button>
            </form>
            
            <div class="auth-divider">O</div>
            
            <p class="auth-link">
                ¿No tienes cuenta? 
                <a href="{{ url_for('registro') }}">Regístrate aquí</a>
            </p>
            
            <div class="demo-info">
                <p><strong>Prueba como Admin:</strong></p>
                <p>Usuario: <code>admin</code></p>
                <p>Contraseña: <code>admin123</code></p>
            </div>
        </div>
    </div>

    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            padding: 20px;
        }

        .auth-box {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .auth-title {
            text-align: center;
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 28px;
        }

        .auth-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error-message {
            background: #ffebee;
            border-left: 4px solid #c62828;
            color: #c62828;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 14px;
        }

        .auth-form .form-group {
            margin-bottom: 18px;
        }

        .auth-form label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .auth-form input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .auth-form input:focus {
            outline: none;
            border-color: var(--secondary);
        }

        .auth-form input::placeholder {
            color: #999;
        }

        .full-width {
            width: 100%;
        }

        .auth-divider {
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-size: 14px;
        }

        .auth-link {
            text-align: center;
            margin: 15px 0;
            font-size: 14px;
            color: #666;
        }

        .auth-link a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .demo-info {
            background: #f5f5f5;
            border-left: 4px solid var(--primary);
            padding: 12px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 12px;
        }

        .demo-info p {
            margin: 4px 0;
            color: #555;
        }

        .demo-info code {
            background: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            color: #333;
        }
    </style>
</body>
</html>
